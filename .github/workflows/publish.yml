# Stages the package on npm, with a provenance statement, when a version tag (0.2.1) is pushed.
# npm trusts this workflow through Trusted Publishing (OIDC): no npm token is stored in the repository.
# A staged version goes live once a maintainer approves it on npmjs.com (or `npm stage approve <id>`) with 2FA.
name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Use an npm that supports staged publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Check the tag matches package.json
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - name: Stage for publishing
        run: npm stage publish --provenance --access public
